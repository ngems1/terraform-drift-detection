<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">terraform-drift-detection: scheduled plans, one message</title>
  <desc id="d">At 06:17 on a weekday the drift workflow starts. One job per target plans a stack with a read-only role: app-storage in staging comes back clean, app-storage in prod comes back with drift (the jobs queue visibility timeout changed from 60 to 300 outside Terraform), and billing in prod fails because its state could not be read. Each job keeps the plan on the runner and uploads only a small JSON report. A notify job combines the reports and posts one message to Slack or Teams: drift check failed for billing, drift in app-storage prod, staging clean, with a link to the run.</desc>
  <style>
    .bg { fill: #0f172a; }
    .h1 { fill: #f8fafc; font: 700 22px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .h2 { fill: #94a3b8; font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lbl { fill: #f1f5f9; font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .mono { fill: #e2e8f0; font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sub { fill: #94a3b8; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .box { fill: #1e293b; stroke: #334155; stroke-width: 2; }
    .job { fill: #1e293b; stroke: #334155; stroke-width: 2; animation: run 10s linear infinite; }
    .card { fill: #111c33; stroke: #334155; stroke-width: 1.5; }
    .line { stroke: #475569; stroke-width: 2; fill: none; }
    .flow { stroke: #475569; stroke-width: 2.5; stroke-dasharray: 7 7; fill: none; animation: dash 1s linear infinite; }
    .hand { stroke: #fbbf24; stroke-width: 3; stroke-linecap: round; transform-origin: 95px 140px; animation: spin 10s linear infinite; }
    .appear { opacity: 0; animation: 10s linear infinite; }
    .a1 { animation-name: at30; } .a2 { animation-name: at38; } .a3 { animation-name: at46; }
    .a4 { animation-name: at62; } .a5 { animation-name: at72; }
    .j1 { animation-delay: 1.2s; } .j2 { animation-delay: 1.4s; } .j3 { animation-delay: 1.6s; }
    @keyframes dash { to { stroke-dashoffset: -14; } }
    @keyframes spin { 0%, 10% { transform: rotate(0deg); } 14%, 100% { transform: rotate(360deg); } }
    @keyframes run { 0% { stroke: #334155; } 2%, 15% { stroke: #38bdf8; fill: #0c4a6e; } 18%, 100% { stroke: #334155; fill: #1e293b; } }
    @keyframes at30 { 0%, 29% { opacity: 0; } 31%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes at38 { 0%, 37% { opacity: 0; } 39%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes at46 { 0%, 45% { opacity: 0; } 47%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes at62 { 0%, 61% { opacity: 0; } 63%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes at72 { 0%, 71% { opacity: 0; } 73%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .appear { opacity: 1; }
    }
  </style>

  <rect class="bg" width="960" height="480"/>
  <text class="h1" x="40" y="38">Drift detection: plan every stack, post one message</text>
  <text class="h2" x="40" y="60">read-only plans · drift = what apply would undo · errors are never silent</text>

  <!-- schedule -->
  <rect class="box" x="40" y="90" width="110" height="100" rx="10"/>
  <circle cx="95" cy="140" r="28" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <line class="hand" x1="95" y1="140" x2="95" y2="118"/>
  <text class="sub" x="95" y="182" text-anchor="middle">06:17 Mon-Fri</text>

  <path class="flow" d="M150,140 H190"/>
  <path class="line" d="M190,140 V110 H220 M190,140 H220 M190,140 V250 H220"/>

  <!-- plan jobs -->
  <rect class="job j1" x="220" y="80" width="250" height="56" rx="8"/>
  <text class="mono" x="234" y="102">plan app-storage/staging</text>
  <text class="sub" x="234" y="122">read-only role (OIDC) · -lock=false</text>
  <rect class="job j2" x="220" y="150" width="250" height="56" rx="8"/>
  <text class="mono" x="234" y="172">plan app-storage/prod</text>
  <text class="sub" x="234" y="192">plan.json never leaves the runner</text>
  <rect class="job j3" x="220" y="220" width="250" height="56" rx="8"/>
  <text class="mono" x="234" y="242">plan billing/prod</text>
  <text class="sub" x="234" y="262">state bucket unreadable</text>

  <!-- reports -->
  <g class="appear a1"><rect x="490" y="86" width="150" height="44" rx="8" fill="#14532d" stroke="#22c55e"/><text class="mono" x="505" y="113">✅ clean</text></g>
  <g class="appear a2"><rect x="490" y="156" width="150" height="44" rx="8" fill="#451a03" stroke="#f59e0b"/><text class="mono" x="505" y="183">🔶 drift</text></g>
  <g class="appear a3"><rect x="490" y="226" width="150" height="44" rx="8" fill="#450a0a" stroke="#f87171"/><text class="mono" x="505" y="253">🚨 error</text></g>
  <text class="sub" x="490" y="300">report.json per target</text>

  <!-- notify -->
  <path class="flow" d="M640,178 H680"/>
  <rect class="box" x="680" y="150" width="90" height="56" rx="8"/>
  <text class="lbl" x="725" y="183" text-anchor="middle">notify</text>
  <path class="line" d="M640,108 C660,108 660,170 680,170 M640,248 C660,248 660,190 680,190"/>
  <path class="flow" d="M725,206 V330"/>

  <!-- message -->
  <g class="appear a4">
    <rect class="card" x="400" y="330" width="520" height="122" rx="10"/>
    <text class="lbl" x="420" y="356">🚨 Terraform drift: drift check FAILED (1 failed, 1 drifted)</text>
    <text class="mono" x="420" y="380">🚨 billing/prod: plan failed: NoSuchBucket</text>
    <text class="mono" x="420" y="402">🔶 app-storage/prod: aws_sqs_queue.jobs:</text>
    <text class="mono" x="440" y="422">visibility_timeout_seconds 60 → 300</text>
    <text class="sub" x="420" y="442">✅ clean: app-storage/staging · Workflow run ↗</text>
  </g>
  <g class="appear a5">
    <rect x="40" y="330" width="330" height="122" rx="10" fill="#111c33" stroke="#334155" stroke-width="1.5"/>
    <text class="lbl" x="56" y="356">one message, to Slack and/or Teams</text>
    <text class="sub" x="56" y="380">only when something needs attention,</text>
    <text class="sub" x="56" y="400">plus a heartbeat every Monday, so</text>
    <text class="sub" x="56" y="420">silence means "clean", not "broken"</text>
  </g>
</svg>
