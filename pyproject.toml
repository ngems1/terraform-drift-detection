[project]
name = "terraform-drift-detection"
version = "0.1.0"
description = "Terraform drift reports (plan JSON + Infracost) for Slack and Microsoft Teams"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
driftwatch = "driftwatch.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "driftwatch"

[dependency-groups]
dev = [
  "mypy>=1.19",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.17",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["driftwatch"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=driftwatch --cov-report=term-missing --cov-fail-under=90"
